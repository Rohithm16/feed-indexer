<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event — Feed Indexer</title>
  <meta name="description" content="Full event detail with all reporting sources." />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>

<!-- ── Header ─────────────────────────────────────────────────────────── -->
<header class="header">
  <a href="index.html" class="header__logo">
    <div class="header__logo-icon">◈</div>
    Feed Indexer
  </a>
  <div class="header__spacer"></div>
  <nav class="header__nav">
    <a href="index.html" class="header__nav-link">Feed</a>
    <a href="settings.html" class="header__nav-link">Settings</a>
  </nav>
</header>

<!-- ── Detail Page ────────────────────────────────────────────────────── -->
<main class="detail-page">

  <a href="index.html" class="detail-back">← Back to feed</a>

  <!-- Loading state -->
  <div id="detail-loading">
    <div class="skeleton" style="height:14px;width:30%;margin-bottom:20px;"></div>
    <div class="skeleton" style="height:32px;width:90%;margin-bottom:12px;"></div>
    <div class="skeleton" style="height:32px;width:70%;margin-bottom:24px;"></div>
    <div class="skeleton" style="height:100px;width:100%;margin-bottom:16px;"></div>
    <div class="skeleton" style="height:80px;width:100%;"></div>
  </div>

  <!-- Error state -->
  <div id="detail-error" class="empty-state" style="display:none">
    <div class="empty-state__icon">⚠</div>
    <div class="empty-state__title">Event not found</div>
    <div class="empty-state__body" id="detail-error-msg"></div>
  </div>

  <!-- Content (hidden until loaded) -->
  <div id="detail-content" style="display:none">

    <!-- Meta row -->
    <div class="detail-meta" id="detail-meta"></div>

    <!-- Title -->
    <h1 class="detail-title" id="detail-title"></h1>

    <!-- Summary -->
    <div class="detail-summary" id="detail-summary"></div>

    <!-- Why it matters block -->
    <div class="detail-why" id="detail-why">
      <div class="detail-why__label">Why it matters</div>
      <div class="detail-why__text" id="detail-why-text"></div>
    </div>

    <!-- Tags -->
    <div class="tags" id="detail-tags" style="margin-bottom: 40px;"></div>

    <!-- Sources section -->
    <div>
      <div class="detail-section-title">
        Reporting Sources — <span id="detail-source-count"></span>
      </div>
      <div class="source-list" id="detail-sources"></div>
    </div>

  </div>
</main>

<!-- Toast notification -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/event.js"></script>
</body>
</html>
