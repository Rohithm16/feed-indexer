<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feed Indexer — AI-Powered News</title>
  <meta name="description" content="Calm, AI-powered news aggregator. Critical events, personalized feed, zero engagement-driven noise." />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>

<!-- ── Header ─────────────────────────────────────────────────────────── -->
<header class="header">
  <a href="index.html" class="header__logo">
    <div class="header__logo-icon">◈</div>
    Feed Indexer
  </a>

  <div class="header__spacer"></div>

  <nav class="header__nav">
    <a href="index.html" class="header__nav-link active">Feed</a>
    <a href="settings.html" class="header__nav-link">Settings</a>
  </nav>

  <button class="header__ingest-btn" id="btn-ingest">Fetch Now</button>
</header>

<!-- ── Main Content ───────────────────────────────────────────────────── -->
<main class="page-wrapper">

  <!-- Empty / loading state -->
  <div id="empty-state" class="empty-state" style="display:none">
    <div class="empty-state__icon">📡</div>
    <div class="empty-state__title">No events yet</div>
    <div class="empty-state__body">
      Click <strong>Fetch Now</strong> in the header to pull the latest news,<br />
      or wait for the background scheduler to run (every 30 minutes).<br /><br />
      Make sure the backend is running at <code>localhost:8000</code>.
    </div>
  </div>

  <!-- ── Critical Section ────────────────────────────────────────────── -->
  <section class="section" id="section-wrapper-critical">
    <div class="section__header">
      <div class="section__dot" style="background:var(--color-critical)"></div>
      <h2 class="section__title">Breaking &amp; Critical</h2>
    </div>
    <div class="events-grid events-grid--critical" id="section-critical"></div>
  </section>

  <!-- ── Local Section ───────────────────────────────────────────────── -->
  <section class="section" id="section-wrapper-local">
    <div class="section__header">
      <div class="section__dot" style="background:var(--color-local)"></div>
      <h2 class="section__title">Local</h2>
    </div>
    <div class="events-grid events-grid--standard" id="section-local"></div>
  </section>

  <!-- ── National Section ────────────────────────────────────────────── -->
  <section class="section" id="section-wrapper-national">
    <div class="section__header">
      <div class="section__dot" style="background:var(--color-national)"></div>
      <h2 class="section__title">National</h2>
    </div>
    <div class="events-grid events-grid--standard" id="section-national"></div>
  </section>

  <!-- ── World Section ───────────────────────────────────────────────── -->
  <section class="section" id="section-wrapper-world">
    <div class="section__header">
      <div class="section__dot" style="background:var(--color-world)"></div>
      <h2 class="section__title">World</h2>
    </div>
    <div class="events-grid events-grid--standard" id="section-world"></div>
  </section>

  <!-- ── Technology Section ──────────────────────────────────────────── -->
  <section class="section" id="section-wrapper-technology">
    <div class="section__header">
      <div class="section__dot" style="background:var(--color-tech)"></div>
      <h2 class="section__title">Technology</h2>
    </div>
    <div class="events-grid events-grid--standard" id="section-technology"></div>
  </section>

  <!-- ── Business Section ────────────────────────────────────────────── -->
  <section class="section" id="section-wrapper-business">
    <div class="section__header">
      <div class="section__dot" style="background:var(--color-business)"></div>
      <h2 class="section__title">Business</h2>
    </div>
    <div class="events-grid events-grid--standard" id="section-business"></div>
  </section>

  <!-- ── Science Section ─────────────────────────────────────────────── -->
  <section class="section" id="section-wrapper-science">
    <div class="section__header">
      <div class="section__dot" style="background:var(--color-science)"></div>
      <h2 class="section__title">Science</h2>
    </div>
    <div class="events-grid events-grid--standard" id="section-science"></div>
  </section>

</main>

<!-- Toast notification -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/home.js"></script>
</body>
</html>
